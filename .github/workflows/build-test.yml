name: Build & Test

on:
  pull_request:
    branches: [ "dev", "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # No -warnaserror here: Directory.Build.props already promotes the dependency-audit
      # warnings (NU1901-NU1904) to errors, and this job surfaces that failure as-is.
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

  # The Dockerfile cross-compiles and publishes RID-specific output, so a break in
  # it would otherwise only surface on push to main, at the publish step. Build both
  # architectures on pull requests without pushing; layer caching keeps it cheap.
  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: HBD.HealthZ.UI/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
