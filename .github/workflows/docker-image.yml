name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit semver to release (default: derived from commit history — (MAJOR)/(MINOR) in a commit message bump those, otherwise patch)"
        required: false
      dry_run:
        description: "Compute and print the next version, build the image, but publish nothing (no push, no tag, no release)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  # Never cancel an in-flight run: a cancelled multi-arch push can leave one
  # architecture published and the other missing.
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: baoduy2412/healthz-ui
  GHCR_IMAGE: ghcr.io/baoduy/healthz-ui

jobs:
  publish:
    # workflow_dispatch has no ref restriction of its own and the Actions UI
    # pre-selects the default branch (dev), so the ref is guarded here as well.
    # A dry run publishes nothing, so it is allowed from any branch.
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the git tag and create the GitHub release
      packages: write       # push to GHCR

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history: the version is derived from it
          fetch-tags: true  # and from the existing v* tags

      # The release level is decided by the commit history, not by a human:
      # a commit message containing (MAJOR) or (MINOR) bumps that component,
      # anything else bumps the patch.
      - name: Calculate version from commit history
        id: semver
        uses: paulhatch/semantic-version@v6.0.2
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false
          search_commit_body: false

      - name: Resolve version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
          DERIVED: ${{ steps.semver.outputs.version }}
        run: |
          set -euo pipefail
          requested="${REQUESTED#v}"
          if [ -n "$requested" ]; then
            [[ "$requested" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$requested' is not semver"; exit 1; }
            version="$requested"
          elif [ -z "$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*')" ]; then
            # No release has ever been cut: semantic-version counts from 0.0.0,
            # this repository starts at 1.0.0.
            version="1.0.0"
          else
            version="$DERIVED"
          fi
          echo "Releasing v${version} from ${GITHUB_SHA}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Next version: \`v${version}\` (commit \`${GITHUB_SHA}\`)" >> "$GITHUB_STEP_SUMMARY"

      # Written BEFORE the image push so a version can never be published twice:
      # if a later step fails, the tag is already on the commit and the next run
      # derives the following version instead of overwriting an immutable tag.
      - name: Tag the commit
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists — re-running an existing release."
            exit 0
          fi
          git tag "v${VERSION}" "${GITHUB_SHA}"
          git push origin "refs/tags/v${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Skipped on a dry run: without credentials a push to either registry is
      # structurally impossible, not merely switched off.
      - name: Log in to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          username: baoduy2412
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha,format=long
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: HBD.HealthZ.UI/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # A dry run exports no image, so there is nothing to attach attestations to.
          provenance: ${{ !inputs.dry_run && 'mode=max' || 'false' }}
          sbom: ${{ !inputs.dry_run }}

      # The deliverable is the published image, so the release is notes and a
      # tag only. Re-running an existing version updates that release in place.
      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
